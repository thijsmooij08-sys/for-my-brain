[project]
name = "polytrader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "starlette==1.7.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "polymarket-client==0.12.0",
  "duckdb==1.5.6",
  "pyarrow==25.0.1",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "prometheus-client==0.24.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1", "ruff==0.8.4", "pyright==1.1.391", "hypothesis==6.168.3"]

[project.optional-dependencies]
# Research integrations are opt-in and never own execution, accounting, or risk.
research = [
  "alpaca-py==0.44.0",
  "pandas==2.3.3",
  "polars==1.44.2",
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "PyPortfolioOpt==1.6.0",
  "Riskfolio-Lib==7.4.0",
  "quantstats==0.0.86",
  "vectorbt==0.28.5",
  "plotly==5.24.1",
  "pandera==0.33.1",
  "mlflow==3.16.1",
  "optuna==5.0.0",
]

feature-store = ["feast==0.66.0"]
orchestration = ["prefect==3.8.7"]
data-providers = ["nasdaq-data-link==1.0.4"]
openbb = ["openbb==5.0.0"]
security = ["pip-audit==2.10.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
