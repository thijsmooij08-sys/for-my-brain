known_technical_debt:
  - "Phase 2 stream supervision is bounded and fail-closed; production deployment still needs external process supervision and alert routing."
  - "Provider-backed fundamentals, macro, and earnings adapters remain future work; Phase 4 engines currently consume canonical point-in-time inputs. Phase 7 shadow forward evidence collection is implemented but remains disabled by default until an operator starts a session."
  - "MLflow and Optuna are installed as research-only integrations; Prefect and Feast are installed in isolated optional environments because their current service stacks conflict with the PolyTrader API pins. FinRL, archived Quantopian Zipline, Alpaca MCP, and SEC-EDGAR MCP remain disabled."
  - "Research dependencies are optional and must never become execution, accounting, or hard-risk authorities."
  - "SEC EDGAR is optional until the operator runs the local User-Agent setup script with an address they control; no credential is required for the rest of the paper system."
  - "A public historical price series is available from Data API v2, but full historical L2 order-book depth must be accumulated prospectively by the PolyTrader capture path."
  - "Full historical executable L2 depth is accumulated prospectively; coverage improves with runtime duration and is not backfilled by the public price-history endpoint."
