name: PolyTrader CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend verification dependencies
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/pip install -e backend
          backend/.venv/bin/pip install pytest==8.3.4 httpx==0.28.1 ruff==0.8.4 pyright==1.1.391 pip-audit==2.10.1
      - name: Run Python checks
        shell: bash
        run: |
          backend/.venv/bin/python -m ruff check backend
          backend/.venv/bin/python -m pytest backend/tests
          (cd backend && .venv/bin/pyright)
          (cd backend && .venv/bin/alembic upgrade head)
          backend/.venv/bin/pip-audit --strict
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Scan for committed secret assignments
        shell: bash
        run: |
          if rg -n --glob '!**/node_modules/**' --glob '!**/.venv/**' '(PRIVATE_KEY|POLYMARKET_API_SECRET|ALPACA_SECRET_KEY)\s*=' .; then
            echo 'Potential committed secret assignment found.' >&2
            exit 1
          fi
      - name: Validate Compose configuration
        run: docker compose config --quiet
