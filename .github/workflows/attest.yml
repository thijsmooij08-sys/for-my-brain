name: Build provenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-source:
    name: Attest source artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create source artifact
        shell: bash
        run: tar --exclude=.git --exclude=.env --exclude=.venv --exclude=node_modules -czf polytrader-source.tar.gz .
      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: polytrader-source
          path: polytrader-source.tar.gz
          if-no-files-found: error
      - name: Attest source artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: polytrader-source.tar.gz
