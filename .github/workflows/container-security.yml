name: Container Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: frontend/Dockerfile

  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs: dockerfiles
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build API image
        run: docker build --tag polytrader-api:ci --file backend/Dockerfile .
      - name: Build frontend image
        run: docker build --tag polytrader-frontend:ci --file frontend/Dockerfile .
      - name: Scan API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: polytrader-api:ci
          format: table
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: polytrader-frontend:ci
          format: table
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
