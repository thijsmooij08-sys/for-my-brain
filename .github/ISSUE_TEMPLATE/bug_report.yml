name: Bug report
description: Report a reproducible PolyTrader problem.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include wallet keys, API secrets, passwords, or private account data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give commands, inputs, and the smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification output
      description: Include relevant test output with sensitive values removed.
    validations:
      required: true
