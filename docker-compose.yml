services:
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LIVE_TRADING_ENABLED: "false"
      POLYTRADER_DATABASE_URL: sqlite:////data/polytrader.db
      POLYTRADER_SEC_USER_AGENT: "${POLYTRADER_SEC_USER_AGENT:-}"
    ports:
      - "8000:8000"
    volumes:
      - polytrader-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.8.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.2.3
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
  paper-worker:
    image: polymarkettrader-api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PAPER_API_URL: http://api:8000
      PAPER_WORKER_ENABLED: "true"
      # Fast paper feedback; the worker enforces a 30-second lower bound.
      PAPER_CYCLE_INTERVAL_SECONDS: "30"
      PAPER_MARKET_LIMIT: "20"
    command: ["python", "-m", "polytrader.paper_worker"]
  market-capture:
    image: polymarkettrader-api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      POLYTRADER_DATABASE_URL: sqlite:////data/polytrader.db
      MARKET_CAPTURE_ENABLED: "true"
      MARKET_CAPTURE_MARKET_LIMIT: "20"
      MARKET_CAPTURE_RETRY_SECONDS: "30"
    volumes:
      - polytrader-data:/data
    command: ["python", "-m", "polytrader.market_capture_worker"]
  backup-worker:
    image: polymarkettrader-api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      POLYTRADER_DATABASE_PATH: /data/polytrader.db
      POLYTRADER_BACKUP_DIR: /backups
      POLYTRADER_BACKUP_INTERVAL_SECONDS: "3600"
      POLYTRADER_BACKUP_RETENTION: "24"
    volumes:
      - polytrader-data:/data:ro
      - polytrader-backups:/backups
    command: ["python", "-m", "polytrader.backup_worker"]

volumes:
  polytrader-data:
  prometheus-data:
  grafana-data:
  polytrader-backups:
